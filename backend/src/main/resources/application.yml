spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: foodya-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    out-of-order: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  cache:
    # The cache is an optimisation: the app must keep working with Redis down.
    enabled: ${FOODYA_REDIS_CACHE_ENABLED:true}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

foodya:
  secrets:
    json-file: ${FOODYA_SECRETS_JSON_FILE:config/api-keys.json}
  cors:
    allowed-origins: ${FOODYA_CORS_ALLOWED_ORIGINS:http://localhost:61679}
  security:
    jwt-secret: ${FOODYA_JWT_SECRET:}
    access-token-minutes: ${FOODYA_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${FOODYA_REFRESH_TOKEN_DAYS:30}
    reset-token-minutes: ${FOODYA_RESET_TOKEN_MINUTES:10}
    otp-expiry-minutes: ${FOODYA_OTP_EXPIRY_MINUTES:10}
  rate-limit:
    auth-requests-per-minute: ${FOODYA_AUTH_RATE_LIMIT_PER_MINUTE:60}
    ai-requests-per-minute: ${FOODYA_AI_RATE_LIMIT_PER_MINUTE:30}
  vnpay:
    tmn-code: ${FOODYA_VNPAY_TMN_CODE:}
    hash-secret: ${FOODYA_VNPAY_HASH_SECRET:}
    url: ${FOODYA_VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${FOODYA_VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    api-url: ${FOODYA_VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    # LOG_ONLY: refunds are recorded, no gateway call. GATEWAY: call the VNPAY refund API.
    refund-mode: ${FOODYA_VNPAY_REFUND_MODE:LOG_ONLY}
  batching:
    # Fixed tick for the batch scheduler. The effective assignment cadence is
    # governed by the runtime system parameter `batching.cooldown_seconds`.
    cycle-interval-ms: ${FOODYA_BATCHING_CYCLE_INTERVAL_MS:10000}
